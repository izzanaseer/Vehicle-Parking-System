<!DOCTYPE html>
<html>
<head>
  <title>Parking System - Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-image">
      <img src="parking-illustration.jpg" alt="Parking" />
    </div>
    <div class="auth-form-side">
      <div class="auth-card">
        <h1>Welcome Back</h1>
        <p class="subtext">Enter your email and password to access the account</p>

        <form id="loginForm">
          <label for="email">Email</label>
          <div class="input-wrap">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="email" placeholder="you@example.com" required />
          </div>

          <label for="password">Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="••••••••" required />
          </div>

          <button type="submit">Login</button>
        </form>

        <p id="loginMessage"></p>
        <p class="switch-link">Don't have an account? <a href="register.html">Register Now</a></p>
      </div>
    </div>
  </div>

  <hr />
  <button id="checkAvailability">Check Availability</button>
  <p id="availabilityResult"></p>

  <script src="js/shared.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
