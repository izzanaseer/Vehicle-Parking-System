<!DOCTYPE html>
<html>
<head>
  <title>Parking System - Register</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-page">

    <div class="auth-image">
      <img src="parking-illustration.jpg" alt="Parking" />
    </div>

    <div class="auth-form-side">
      <div class="auth-card">
        <h1>Create Account</h1>
        <p class="subtext">Sign up to check and manage parking availability</p>

        <form id="registerForm">
          <label for="email">Email</label>
          <div class="input-wrap">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="email" placeholder="you@example.com" required />
          </div>

          <label for="password">Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="At least 6 characters" required minlength="6" />
          </div>

          <button type="submit">Register</button>
        </form>

        <p id="registerMessage"></p>
        <p class="switch-link">Already have an account? <a href="index.html">Login</a></p>
      </div>
    </div>
  </div>

  <script src="js/shared.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
