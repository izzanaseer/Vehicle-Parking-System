<!DOCTYPE html>
<html>

<head>
  <title>Parking System - Dashboard</title>
  <script>
    if (!sessionStorage.getItem("token")) {
      window.location.href = "index.html";
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav class="navbar">
    <div class="navbar-brand">
      <i class="fa-solid fa-square-parking"></i> Parking System
    </div>
    <button id="logout" class="logout-btn">
      <i class="fa-solid fa-right-from-bracket"></i> Logout
    </button>
  </nav>

  <main class="dashboard-main">
    <section class="availability-card">
      <div class="availability-text">
        <h1>Parking Availability</h1>
        <p class="subtext">Live count of open parking slots</p>
        <button id="checkAvailability" class="primary-btn">
          <i class="fa-solid fa-arrows-rotate"></i> Refresh
        </button>
      </div>
      <div class="availability-stat">
        <span id="availableCount">—</span>
        <span class="stat-divider">/</span>
        <span id="totalCount">—</span>
        <p class="stat-label">Slots Available</p>
      </div>
    </section>

    <section id="adminControls" class="admin-card" style="display: none;">
      <h2><i class="fa-solid fa-user-shield"></i> Issue Ticket</h2>
      <div class="ticket-form">
        <div class="input-wrap">
          <i class="fa-solid fa-hashtag"></i>
          <input type="text" id="vehicleNumber" placeholder="Vehicle number, e.g. ABC-123" />
        </div>
        <select id="vehicleType">
          <option value="Car">Car</option>
          <option value="Bike">Bike</option>
          <option value="Truck">Truck</option>
        </select>
        <button id="issueTicket" class="primary-btn">Issue Ticket</button>
      </div>
      <div id="issuedTicket" class="ticket-result"></div>

      <hr />

      <h2><i class="fa-solid fa-right-from-bracket"></i> Exit & Payment</h2>
      <div class="ticket-form">
        <div class="input-wrap">
          <i class="fa-solid fa-ticket"></i>
          <input type="number" id="exitTicketId" placeholder="Ticket ID" />
        </div>
        <button id="calculateExit" class="secondary-btn">Calculate Exit Fee</button>
      </div>
      <div id="exitResult" class="result-text"></div>

      <div id="paymentSection" style="display: none;" class="ticket-form">
        <select id="paymentMethod">
          <option value="Cash">Cash</option>
          <option value="Card">Card</option>
          <option value="JazzCash">JazzCash</option>
        </select>
        <button id="confirmPayment" class="primary-btn">Confirm Payment</button>
      </div>
      <div id="paymentResult" class="result-text"></div>
    </section>
  </main>

  <div id="printTicket" class="print-only"></div>
  
  <script src="js/shared.js"></script>
  <script src="js/parking.js"></script>
</body>

</html>
