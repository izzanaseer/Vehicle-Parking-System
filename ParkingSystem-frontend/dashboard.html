<!DOCTYPE html>
<html>
<head>
  <title>Parking System - Dashboard</title>
  <script>
    if (!sessionStorage.getItem("token")) {
      window.location.href = "index.html";
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <i class="fa-solid fa-square-parking"></i>
        <div>
          <div class="brand-name">ParkEase</div>
          <div class="brand-sub">Admin Portal</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item active"><i class="fa-solid fa-gauge"></i> Dashboard</a>
        <a href="#" class="nav-item"><i class="fa-solid fa-ticket"></i> Issue Ticket</a>
        <a href="#" class="nav-item"><i class="fa-solid fa-right-from-bracket"></i> Exit & Payment</a>
      </nav>

      <div class="sidebar-footer">
        <div class="profile-box">
          <i class="fa-solid fa-circle-user"></i>
          <div>
            <div class="profile-email" id="profileEmail">—</div>
            <div class="profile-role" id="profileRole">—</div>
          </div>
        </div>
        <button id="logout" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
      </div>
    </aside>

    <main class="content-area">
      <section class="welcome-banner">
        <h1>Keep things moving</h1>
        <p>Welcome back, <span id="welcomeUser">—</span>. Issue tickets, process exits, and track live availability — all in one place.</p>
      </section>

      <section class="availability-overview">
        <div class="section-header">
          <h2>Space Availability</h2>
          <button id="checkAvailability" class="refresh-btn"><i class="fa-solid fa-arrows-rotate"></i> Refresh</button>
        </div>
        <div class="stat-grid" id="statGrid"></div>
      </section>

      <section id="adminControls" class="admin-grid" style="display: none;">
        <div class="panel">
          <h2><i class="fa-solid fa-ticket"></i> Issue Ticket</h2>
          <label>Vehicle Number</label>
          <div class="input-wrap">
            <i class="fa-solid fa-hashtag"></i>
            <input type="text" id="vehicleNumber" placeholder="e.g. ABC-123" />
          </div>
          <label>Vehicle Type</label>
          <select id="vehicleType">
            <option value="Car">Car</option>
            <option value="Bike">Bike</option>
            <option value="Truck">Truck</option>
          </select>
          <button id="issueTicket" class="primary-btn">Issue Ticket</button>
          <div id="issuedTicket" class="panel-result"></div>
        </div>

        <div class="panel">
          <h2><i class="fa-solid fa-right-from-bracket"></i> Exit & Payment</h2>
          <label>Ticket ID</label>
          <div class="input-wrap">
            <i class="fa-solid fa-ticket"></i>
            <input type="number" id="exitTicketId" placeholder="e.g. 7" />
          </div>
          <button id="calculateExit" class="primary-btn">Calculate Exit Fee</button>
          <div id="exitResult" class="panel-result"></div>

          <div id="paymentSection" class="payment-row" style="display: none;">
            <div class="payment-select-wrap">
              <label>Payment Method</label>
              <select id="paymentMethod">
                <option value="Cash">Cash</option>
                <option value="Card">Card</option>
                <option value="JazzCash">JazzCash</option>
              </select>
            </div>
            <button id="confirmPayment" class="primary-btn">Confirm Payment</button>
          </div>
          <div id="paymentResult" class="panel-result"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="printTicket" class="print-only"></div>

  <script src="js/shared.js"></script>
  <script src="js/parking.js"></script>
</body>
</html>
